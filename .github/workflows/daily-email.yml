name: Enviar Excel diario ChirpStack

on:
  workflow_dispatch:
    inputs:
      forzar_envio:
        description: "Enviar aunque ya se haya enviado hoy (para pruebas)"
        type: boolean
        default: false
  schedule:
    - cron: "5 12 * * *"

# Necesario para que la Action pueda hacer commit/push de historial_diario.json
permissions:
  contents: write

jobs:
  generar-y-enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calcular fecha Chile
        id: hora
        run: |
          python3 -c "
          from datetime import datetime
          from zoneinfo import ZoneInfo

          chile = ZoneInfo('America/Santiago')
          ahora = datetime.now(chile)
          hoy = ahora.strftime('%Y-%m-%d')

          print(f'hoy={hoy}')
          print(f'hora_actual={ahora.strftime(\"%H:%M\")}')
          " >> "$GITHUB_OUTPUT"

      - name: Verificar si ya se envió hoy
        id: marca
        uses: actions/cache@v4
        with:
          path: marca_envio
          key: envio-diario-${{ steps.hora.outputs.hoy }}

      - name: Decidir si corresponde enviar
        id: decision
        run: |
          if [ "${{ steps.marca.outputs.cache-hit }}" != "true" ] || [ "${{ inputs.forzar_envio }}" == "true" ]; then
            echo "enviar=true" >> "$GITHUB_OUTPUT"
          else
            echo "enviar=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Fecha Chile: ${{ steps.hora.outputs.hoy }} | Ya enviado hoy: ${{ steps.marca.outputs.cache-hit }} | Forzado: ${{ inputs.forzar_envio }}"

      - name: Instalar dependencias
        if: steps.decision.outputs.enviar == 'true'
        run: pip install chirpstack-api requests openpyxl

      - name: Generar Excel actualizado
        id: generar
        if: steps.decision.outputs.enviar == 'true'
        env:
          CHIRPSTACK_API_TOKEN: ${{ secrets.CHIRPSTACK_API_TOKEN }}
        run: python generar_excel_diario.py

      - name: Enviar por correo
        if: steps.decision.outputs.enviar == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ChirpStack Sync
          to: ${{ secrets.MAIL_TO }}
          subject: "Estado de conexiones ChirpStack - ${{ steps.generar.outputs.archivo }}"
          body: "Adjunto el Excel actualizado con el último dato recibido de cada equipo."
          attachments: ${{ steps.generar.outputs.archivo }}

      - name: Guardar historial_diario.json en el repositorio
        if: steps.decision.outputs.enviar == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historial_diario.json
          if git diff --staged --quiet; then
            echo "Sin cambios en historial_diario.json"
          else
            git commit -m "Actualizar historial diario ChirpStack"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi

      - name: Marcar como enviado hoy
        if: steps.decision.outputs.enviar == 'true'
        run: |
          mkdir -p marca_envio
          echo "${{ steps.hora.outputs.hoy }}" > marca_envio/enviado.txt
