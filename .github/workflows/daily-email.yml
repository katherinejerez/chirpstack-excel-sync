name: Enviar Excel diario ChirpStack

on:
  workflow_dispatch: {}
  schedule:
    # Corre cada 5 min en una ventana ancha (12-14 UTC) para cubrir
    # tanto horario estándar (UTC-4) como de verano (UTC-3) en Chile.
    # El paso "Calcular hora Chile" decide si realmente toca enviar.
    - cron: "*/5 12-14 * * *"

jobs:
  generar-y-enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calcular hora Chile
        id: hora
        run: |
          python3 -c "
          from datetime import datetime
          from zoneinfo import ZoneInfo

          chile = ZoneInfo('America/Santiago')
          ahora = datetime.now(chile)
          hoy = ahora.strftime('%Y-%m-%d')

          # Ventana de envío: entre 9:15 y 10:00 hora Chile
          ventana_ok = (ahora.hour == 9 and ahora.minute >= 15) or (ahora.hour == 10 and ahora.minute <= 30)

          print(f'hoy={hoy}')
          print(f'debe_enviar={str(ventana_ok).lower()}')
          print(f'hora_actual={ahora.strftime(\"%H:%M\")}')
          " >> "$GITHUB_OUTPUT"

      - name: Verificar si ya se envió hoy
        id: marca
        uses: actions/cache@v4
        with:
          path: marca_envio
          key: envio-diario-${{ steps.hora.outputs.hoy }}

      - name: Decidir si corresponde enviar
        id: decision
        run: |
          if [ "${{ steps.hora.outputs.debe_enviar }}" = "true" ] && [ "${{ steps.marca.outputs.cache-hit }}" != "true" ]; then
            echo "enviar=true" >> "$GITHUB_OUTPUT"
          else
            echo "enviar=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Hora Chile: ${{ steps.hora.outputs.hora_actual }} | Ya enviado hoy: ${{ steps.marca.outputs.cache-hit }} | Enviar ahora: (ver arriba)"

      - name: Instalar dependencias
        if: steps.decision.outputs.enviar == 'true'
        run: pip install chirpstack-api requests openpyxl

      - name: Generar Excel actualizado
        id: generar
        if: steps.decision.outputs.enviar == 'true'
        env:
          CHIRPSTACK_API_TOKEN: ${{ secrets.CHIRPSTACK_API_TOKEN }}
        run: python generar_excel_diario.py

      - name: Enviar por correo
        if: steps.decision.outputs.enviar == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ChirpStack Sync
          to: ${{ secrets.MAIL_TO }}
          subject: "Estado de conexiones ChirpStack - ${{ steps.generar.outputs.archivo }}"
          body: "Adjunto el Excel actualizado con el último dato recibido de cada equipo."
          attachments: ${{ steps.generar.outputs.archivo }}

      - name: Marcar como enviado hoy
        if: steps.decision.outputs.enviar == 'true'
        run: |
          mkdir -p marca_envio
          echo "${{ steps.hora.outputs.hoy }}" > marca_envio/enviado.txt
